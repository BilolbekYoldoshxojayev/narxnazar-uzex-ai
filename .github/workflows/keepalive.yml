# Keeps the free Render instance awake (it sleeps after 15 min idle). Backup to an external pinger like cron-job.org.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 https://narxnazar-uzex-ai.onrender.com/health || true
