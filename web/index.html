<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NarxNazar · UZEX birja AI-agenti</title>
<style>
  :root{--bg:#0a1033;--panel:#111a4d;--line:#24306e;--ink:#e9edff;--mute:#8f9bd6;--green:#3ee07a;--blue:#3b5bff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .logo{width:26px;height:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .logo i{background:var(--green)} .logo i:nth-child(2n){background:var(--blue)}
  .tag{font:11px ui-monospace,Consolas,monospace;color:var(--bg);background:var(--green);padding:3px 8px;letter-spacing:.06em}
  .langs button{background:none;border:1px solid var(--line);color:var(--mute);font:12px ui-monospace,monospace;padding:4px 9px;cursor:pointer}
  .langs button.on{color:var(--bg);background:var(--green);border-color:var(--green)}
  main{flex:1;width:100%;max-width:860px;margin:0 auto;padding:24px 18px 140px}
  h1{margin:8px 0 2px;font-size:30px;line-height:1.15}
  h1 span{background:var(--blue);padding:0 8px}
  .sub{color:var(--mute);margin:10px 0 18px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .stat{border:1px solid var(--line);background:var(--panel);padding:8px 12px;font:12px ui-monospace,monospace;color:var(--mute)}
  .stat b{display:block;color:var(--ink);font:600 18px system-ui}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 11px;font-size:13px;cursor:pointer;text-align:left}
  .chip:hover{border-color:var(--green)}
  .msg{margin:14px 0;padding:14px 16px;border:1px solid var(--line);background:var(--panel);white-space:pre-wrap;word-break:break-word}
  .msg.q{background:transparent;border-left:3px solid var(--green)}
  .msg.a{border-left:3px solid var(--blue)}
  .meta{margin-top:10px;font:11px ui-monospace,monospace;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .meta .ok{color:var(--green)}
  details summary{cursor:pointer;color:var(--mute)}
  pre{background:#070b26;border:1px solid var(--line);padding:10px;overflow:auto;font:12px ui-monospace,monospace;white-space:pre-wrap}
  .dots::after{content:"";animation:d 1.2s steps(4) infinite}
  @keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  form{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:26px 18px 18px}
  .bar{max-width:860px;margin:0 auto;display:flex;gap:8px}
  textarea{flex:1;resize:none;height:54px;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:14px;font:inherit;outline:none}
  textarea:focus{border-color:var(--green)}
  .send{background:var(--green);color:var(--bg);border:0;padding:0 20px;font-weight:700;cursor:pointer}
  .send:disabled{opacity:.5;cursor:wait}
  .how{border:1px solid var(--line);background:var(--panel);padding:10px 14px;margin-bottom:20px}
  .how summary{cursor:pointer;font-weight:600;color:var(--green)} .how ol{margin:10px 0 2px;padding-left:20px;color:var(--mute)} .how li{margin:4px 0}
  footer{font:11px ui-monospace,monospace;color:var(--mute);text-align:center;padding:6px}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>NarxNazar <span class="tag">UZEX AI HACKATHON 2026</span></div>
  <div class="langs"><button data-l="uz" class="on">UZ</button> <button data-l="ru">RU</button></div>
</header>
<main>
  <h1 id="t1"></h1>
  <p class="sub" id="t2"></p>
  <div class="stats">
    <div class="stat"><b>500 000</b><span id="s1"></span></div>
    <div class="stat"><b>6 616</b><span id="s2"></span></div>
    <div class="stat"><b>14 392</b><span id="s3"></span></div>
    <div class="stat"><b>2022–2026</b><span id="s4"></span></div>
  </div>
  <details class="how"><summary id="howt"></summary><ol id="how"></ol></details>
  <div class="chips" id="chips"></div>
  <div id="log"></div>
</main>
<form id="f">
  <div class="bar"><textarea id="q" required></textarea><button class="send" id="b">→</button></div>
  <footer>RU · UZ (lotin / кирилл) · Gemini + Groq · DuckDB</footer>
</form>
<script>
const T={uz:{t1:'Birja bitimlari bo‘yicha<br><span>AI-agent</span>',t2:'Savollarga faqat birja ma’lumotlari asosida aniq javob beradi. Har bir raqam SQL so‘rov natijasidan olinadi.',
 s1:'bitim',s2:'shartnoma',s3:'ishtirokchi',s4:'davr',ph:'Savolingizni yozing…',howt:'⚙️ Qanday ishlaydi?',how:['Savoldan tovar, viloyat, kompaniya, STIR va bitim raqami lug‘at va transliteratsiya yordamida aniqlanadi (LLM siz).','O‘xshash tekshirilgan savollar va ularning SQL yechimlari topiladi (RAG).','Ikki xil AI-model (Gemini va Groq) mustaqil ravishda SQL so‘rov yozadi.','So‘rovlar 500 000 bitimli DuckDB bazasida bajariladi va natijalar solishtiriladi.','Javobdagi raqamlar faqat SQL natijasidan qo‘yiladi — model raqam o‘ylab topa olmaydi. Ma’lumot bo‘lmasa, shuni aytadi.'],sql:'SQL so‘rov',think:'Hisoblanmoqda',ver:'2 model tasdiqladi',err:'Xatolik, qayta urinib ko‘ring.',
 ex:['2025-yilda karbamid bo‘yicha nechta bitim tuzilgan?','2024-yilda Namangan viloyatida sement savdosi summasi qancha?','280091-sonli bitimda xaridor kim va 1 tonna narxi qancha?','2026-yilda ammiakli selitraning top-3 xaridori','STIR 945809173 kompaniyasi nechta bitimda xaridor bo‘lgan?']},
 ru:{t1:'AI-агент по<br><span>биржевым сделкам</span>',t2:'Отвечает на вопросы строго по данным биржи. Каждое число берётся из результата SQL-запроса.',
 s1:'сделок',s2:'контрактов',s3:'участников',s4:'период',ph:'Введите вопрос…',howt:'⚙️ Как это работает?',how:['Из вопроса извлекаются товар, регион, компания, ИНН и номер сделки — словари и транслитерация, без LLM.','Находятся похожие проверенные вопросы с готовыми SQL-решениями (RAG).','Две разные AI-модели (Gemini и Groq) независимо пишут SQL-запрос.','Запросы выполняются в базе DuckDB из 500 000 сделок, результаты сверяются.','Числа в ответе берутся только из результата SQL — модель не может выдумать цифры. Если данных нет, агент так и говорит.'],sql:'SQL-запрос',think:'Считаю',ver:'подтверждено 2 моделями',err:'Ошибка, попробуйте ещё раз.',
 ex:['Сколько сделок по карбамиду было в 2025 году?','Средняя цена бензина АИ-92 за тонну в 2025 году','Кто покупатель по сделке 280091 и какая цена за тонну?','Топ-3 покупателя аммиачной селитры в 2026 году','Какой процент сделок аннулирован в 2024 году?']}};
let L='uz';const $=id=>document.getElementById(id),log=$('log');
function setLang(l){L=l;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l==l));
 for(const k of['t1','t2','s1','s2','s3','s4','howt'])$(k).innerHTML=T[l][k];$('how').innerHTML=T[l].how.map(x=>'<li>'+x+'</li>').join('');$('q').placeholder=T[l].ph;
 $('chips').innerHTML='';T[l].ex.forEach(e=>{const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=e;c.onclick=()=>ask(e);$('chips').append(c)})}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang('uz');
function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;log.append(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d}
async function ask(q){q=q.trim();if(!q)return;$('q').value='';$('b').disabled=true;add('q',q);
 const a=add('a','');a.innerHTML='<span class="dots">'+T[L].think+'</span>';
 try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})}).then(r=>r.json());
  a.textContent=r.answer||T[L].err;const m=document.createElement('div');m.className='meta';
  m.innerHTML=`<span>⏱ ${((r.ms||0)/1000).toFixed(1)} s</span>`+(r.agreed?`<span class="ok">✓ ${T[L].ver}</span>`:'');
  a.append(m);if(r.sql){const d=document.createElement('details');d.innerHTML=`<summary>${T[L].sql}</summary><pre></pre>`;d.querySelector('pre').textContent=r.sql;a.append(d)}
 }catch(e){a.textContent=T[L].err}
 $('b').disabled=false;$('q').focus()}
$('f').onsubmit=e=>{e.preventDefault();ask($('q').value)};
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask($('q').value)}});
</script>
</body>
</html>
